<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Endpoint Generator</title>
</head>
<body>
    <h1>Generate Video Streaming Endpoints</h1>
    <input type="text" id="videoNameInput" placeholder="Enter video names (comma-separated)">
    <button onclick="generateEndpoints()">Generate Endpoints</button>
    
    <h2>Generated Endpoints</h2>
    <div id="result"></div>

    <script>
        async function generateEndpoints() {
            const input = document.getElementById('videoNameInput').value;
            const videoNames = input.split(',').map(name => name.trim());

            if (videoNames.length === 0) {
                alert("Please enter at least one video name.");
                return;
            }

            const response = await fetch("http://localhost:8000/generate_video_endpoints", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ video_names: videoNames })
            });

            const data = await response.json();
            
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "";

            if (data.endpoints) {
                data.endpoints.forEach(endpoint => {
                    const p = document.createElement("p");
                    const link = document.createElement("a");
                    link.href = endpoint;
                    link.textContent = endpoint;
                    link.target = "_blank"; // Open in a new tab
                    p.appendChild(link);
                    resultDiv.appendChild(p);
                });
            } else {
                resultDiv.textContent = "No videos found.";
            }
        }
    </script>
</body>
</html>
