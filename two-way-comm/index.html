<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Streaming</title>
</head>
<body>
    <h1>Live Video Stream</h1>

    <!-- Input for Video Path -->
    <label for="videoPath">Enter Video Path:</label>
    <input type="text" id="videoPath" placeholder="e.g., /path/to/video.mp4">
    <button onclick="handleVideoRequest()">Start Stream</button>

    <h2>Video Feed:</h2>
    <img id="video-stream" width="640" height="360" alt="Video Stream Will Appear Here">
    <script src="script.js"></script>
</body>
</html>
