<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <img src="ITMS LOGO.png" alt="Website Logo" class="logo-image">
            <h1 class="logo-text">Road Guard</h1>
        </div>
        <div class="user-menu">
            <button class="user-button">User</button>
            <ul class="dropdown">
                <li><a href="#">Account Settings</a></li>
                <li><a href="Login.html">Log-out</a></li>
            </ul>
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-header">
        </div>
        <div class="modal-body">
        </div>
        <div class="modal-footer">
            <button class="btn" id="close-modal-button">Close</button>
            <button class="btn" id="add-camera-button">Add Camera</button>
            
        </div>
    </div>

    <div id="modal-header-contents">
        <div id="add-camera-header"> New Camera</div>
    </div>

    <div id="modal-contents" style="display: none;">
        <div id="add-camera-content">
            <label for="camera-name">Camera Name: </label><br>
            <input type="text" id="camera-name" name="camera-name" placeholder="Enter Camera Name"><br>
            <label for="camera-api">Camera API: </label><br>
            <input type="text" id="camera-api" name="camera-api" placeholder="Enter API"><br>
        </div>

        <div id="speed-content" style="display: none;">
            <canvas id="speedGraph_bsu"></canvas>
        </div>
        
        <div id="logs-content" style="display: none;">
            <canvas id="vehicleClassificationGraph"></canvas>
        </div>
        

    </div>
    <!-- New Content Section -->
    <div class="content-container">
        <aside class="sidebar">
          <div class="camera-list-title">
            <span>Camera List</span>
            <button>Reload</button>
        </div>
            <ul id="camera-list">
                <li><a href="#">BSU ROAD 1</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="button-container">
                <div class="left-buttons">
                    <button class="left-btn">1x1</button>
                    <button class="left-btn">2x2</button>
                    <button class="left-btn">3x3</button>
                    <button class="left-btn">4x4</button>
                    <button class="left-btn">25</button>
                    <button class="left-btn">26</button>
                </div>
  
                 <!-- Buttons on top -->    
                <div class="top-buttons">
                    <div class="dropdown-container classification-dropdown">
                        <button class="top-btn dropdown-btn">Classification Type</button>
                        <ul class="dropdown-menu">
                            <li>Pedestrian</li>
                            <li>Car</li>
                            <li>Motor</li>
                            <li>Motorcycle</li>
                            <li>Jeepney</li>
                        </ul>
                    </div>
                    <button modal-button="speed" class="top-btn">Speed</button> 
                    <button modal-button="logs" class="top-btn">Logs over Time</button>
                    <button modal-button="add-camera" class="top-btn" id="open-modal-button">Add Camera</button>
                    <button id="fullscreen-btn">&#x26F6;</button>
                    
                </div>

                <!-- Video Player -->
                <div class="video-container">
                    <div id="video_feed1" width="100%" controls autoplay>
                        <img src="http://localhost:8080/PB_video_feed" alt="PB Video Feed" onerror="this.src='errorvideo.png'">
                    </div>
                </div>
                  
            </div>
        </main>
    </div>
    <!-- End of New Content Section -->

    <footer class="footer">
        <p>Copyright @ Batangas State University</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
