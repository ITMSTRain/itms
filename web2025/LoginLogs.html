<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="Logs.css">

<body>
  <div class="header">
      <div class="logo-container">
          <img src="ITMS LOGO.png" alt="Website Logo" class="logo-image">

      </div>
      <div class="user-menu">

              <tr>
                  <td>admin3</td>
                  <td>2025-01-05</td>

  <footer class="footer">

  </footer>

  <script src="Logs.js"></script>
