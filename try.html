<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Video List</title>
</head>
<body>
    <h1>Video List</h1>
    <ul id="videoList"></ul>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'https://jplabypqlbviskgkxapf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwbGFieXBxbGJ2aXNrZ2t4YXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzgxMTg2NTgsImV4cCI6MjA1MzY5NDY1OH0.yWbJOxhJRZ0eI-IAQr2tRMK3rTHGTrYbw4Q9xp1d9XI';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function fetchData() {
            const { data, error } = await supabase
                .from('videos')
                .select('video_name, video_link'); 

            if (error) {
                console.error('Error fetching data:', error);
                return;
            }

            const videoList = document.getElementById('videoList');

            data.forEach(video => {
                const listItem = document.createElement('li');
                const link = document.createElement('a');
                link.textContent = video.video_name;
                link.href = video.video_links;
                link.target = '_blank';
                listItem.appendChild(link);
                videoList.appendChild(listItem);
            });
        }

        fetchData();
    </script>
</body>
</html>
