<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="Logs.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script defer src="Logs.js"></script>
</head>
<body>
  <div class="header">
      <div class="logo-container">
          <img src="ITMS LOGO.png" alt="Website Logo" class="logo-image">
          <h1 class="logo-text">Road Guard</h1>
      </div>
      <div class="user-menu">
          <button class="go-back-button" onclick="goBack()">Go Back</button>
          <button id="logoutButton" class="logout-button">Logout</button>
      </div>
  </div>

  <!-- Main Content Section -->
  <main class="main-content">
      <h2 class="content-title">Admin Logs</h2>

      <!-- Table for Logs -->
      <table class="logs-table">
          <thead>
              <tr>
                  <th>User</th>
                  <th>Date</th>
                  <th>Time In</th>
                  <th>Time Out</th>
              </tr>
          </thead>
          <tbody>

          </tbody>
      </table>
  </main>

  <footer class="footer">
      <p>Copyright @ Batangas State University</p>
  </footer>

  <script defer src="logout.js"></script>
</body>
</html>
