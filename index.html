<!DOCTYPE html>
<html lang="en">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <div class="logo-container">
        <img src="ITMS LOGO.png" alt="Website Logo" class="logo-image">
        <h1 class="logo-text">Road Guard</h1>
    </div>
    <div class="user-menu">
      <button class="user-button">User</button>
      <ul class="dropdown">
          <li><a href="#">Account Settings</a></li>
          <li><a href="Login.html">Log-out</a></li>
      </ul>
  </div>
</div>

<div class="content">
  <div class="main-container">
    <div class="main-header">
      <div class="main-header">
        <div class="button-bar">
          <!-- Group of four buttons -->
          <div class="button-group">
            <button class="btn-analytics">Analytics</button>
            <button class="btn-speed">Speed</button>
            <div id="graph-container" style="display: none;">
              <canvas id="speedGraph_bsu"></canvas>
              <canvas id="speedGraph_pb"></canvas>
            </div>
            <button class="btn-classification">Classification</button>
            <button class="btn-logs">Logs over Time</button>
          </div>
      
          <!-- Camera dropdown -->
          <div class="camera-container">
            <div class="camera-dropdown">
              <button class="dropbtn">Camera</button>
              <div class="dropdown-content">
                <a href="#">Main Road</a>
                <a href="#">District Road</a>
                <a href="#">Other Road</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    <div class="video-grid">
      <div class="video-item" >
        <img id="pbVideoFeed" src="http://localhost:8000/PB_video_feed" alt="PB Video Feed">
      </div>
      <div class="video-item">
        <img id="pbVideoFeed" src="http://localhost:8000/PB_video_feed" alt="PB Video Feed">
      </div>
      <div class="video-item">
        <img id="pbVideoFeed" src="http://localhost:8000/PB_video_feed" alt="PB Video Feed">
      </div>
      <div class="video-item">
        <img id="pbVideoFeed" src="http://localhost:8000/PB_video_feed" alt="PB Video Feed">
      </div>
      <div class="video-item">
        <img id="pbVideoFeed" src="http://localhost:8000/PB_video_feed" alt="PB Video Feed">
      </div>
      <div class="video-item">
        <img id="pbVideoFeed" src="http://localhost:8000/PB_video_feed" alt="PB Video Feed">
      </div>
      <div class="video-item">
        <img id="pbVideoFeed" src="http://localhost:8000/PB_video_feed" alt="PB Video Feed">
      </div>
      <div class="video-item">
        <img id="pbVideoFeed" src="http://localhost:8000/PB_video_feed" alt="PB Video Feed">
      </div>
      <div class="video-item">
        <img id="pbVideoFeed" src="http://localhost:8000/PB_video_feed" alt="PB Video Feed">
      </div>
    </div>
  </div>
</div>

<!-- Popup for the Image Feed -->
<div class="popup-overlay" id="popupOverlay" onclick="closeImagePopup()"></div>
<div class="popup-video" id="popupImagePopup">
    <img id="popupImageElement" alt="Popup Video Feed">
    <span class="close-btn" onclick="closeImagePopup()">×</span>
</div>

<div id="popup-modal" class="popup-modal">
  <div class="popup-content">
    <span id="close-btn" class="close-btn">&times;</span>
    <div id="popup-data"></div>
  </div>
<script src="script.js"></script>

  
</body>
</div>
<footer class="footer">
  <p>Copyright @ Batangas State University</p>
</footer>
</div>


</html>
