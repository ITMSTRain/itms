<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Highlight (GSAP)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .highlightable {
            width: 150px;
            height: 50px;
            background-color: lightgray;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .not-highlightable {
            width: 150px;
            height: 50px;
            background-color: lightgray;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>
    <div class="highlightable">Item 1</div>
    <div class="highlightable">Item 2</div>
    <div class="highlightable">Item 3</div>
    <div class="not-highlightable">Not Clickable</div> <!-- Won't be affected -->

    <script>
        document.querySelectorAll(".highlightable").forEach(item => {
            item.addEventListener("click", function() {
                toggleHighlight(this);
            });
        });

        function toggleHighlight(el) {
            if (el.classList.contains("highlighted")) {
                gsap.to(el, { backgroundColor: "lightgray", boxShadow: "none", duration: 0.3 });
                el.classList.remove("highlighted");
            } else {
                gsap.to(el, { backgroundColor: "yellow", boxShadow: "0 0 10px gold", duration: 0.3 });
                el.classList.add("highlighted");
            }
        }
    </script>
</body>
</html>
